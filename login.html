<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0f172a] text-slate-300 min-h-screen flex items-center justify-center p-4">
<form id="f" class="bg-[#1e293b] border border-slate-700 rounded-xl shadow p-6 w-full max-w-sm space-y-4">
<h1 class="text-xl font-bold text-white">Digital Labour Payment &amp; Hajiri System</h1>
<input id="e" type="email" required placeholder="Email" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2">
<input id="p" type="password" required minlength="6" placeholder="Password" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2">
<label class="flex gap-2 text-sm"><input id="r" type="checkbox" checked> Remember session</label>
<button class="w-full bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg p-2">Sign in</button><p id="m" class="text-red-400 text-sm"></p></form>
<script type="module">
import { auth } from "./js/firebase-config.js";
import { signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
f.onsubmit = async ev => { ev.preventDefault();
  try { await setPersistence(auth, r.checked ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, e.value, p.value); location.href = "dashboard.html"; }
  catch { m.textContent = "Invalid email or password."; } };
</script></body></html>
